openapi: "3.1.0"
info:
  title: Release Catalog API
  description: |
    Dependency-Track連携型 Release Catalog API。
    製品のMain/Release Branch管理、SBOM構成のBOM-Linkグラフ解決を提供する。
  version: "1.0.0"
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /api/v1/products:
    post:
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      summary: List products
      operationId: listProducts
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /api/v1/products/{productId}:
    get:
      summary: Get a product
      operationId: getProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update a product
      operationId: updateProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a product
      operationId: deleteProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/products/{productId}/branches:
    get:
      summary: List branches for a product
      operationId: listBranches
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BranchLine"

  /api/v1/products/{productId}/release-lines:
    post:
      summary: Create a release line
      operationId: createReleaseLine
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseLineInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchLine"

  /api/v1/branches/{branchId}:
    get:
      summary: Get a branch
      operationId: getBranch
      parameters:
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchLine"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update a branch
      operationId: updateBranch
      parameters:
        - $ref: "#/components/parameters/BranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBranchInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchLine"

  /api/v1/branches/{branchId}/versions:
    post:
      summary: Create (preset) a version
      description: |
        Presets a git-like version on the branch line. Only `versionString` is
        required; DT projects and release metadata are filled in later.
      operationId: createVersion
      parameters:
        - $ref: "#/components/parameters/BranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVersionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      summary: List versions on a branch (ordered by release datetime)
      operationId: listVersions
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Version"

  /api/v1/versions/{versionId}:
    get:
      summary: Get a version (incl. role-tagged projects)
      operationId: getVersion
      parameters:
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Edit any field (soft immutability)
      operationId: updateVersion
      parameters:
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVersionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a version
      operationId: deleteVersion
      parameters:
        - $ref: "#/components/parameters/VersionId"
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/versions/{versionId}/projects/root:
    put:
      summary: Set or replace the single ROOT DT project binding
      operationId: setVersionRoot
      parameters:
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetProjectInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDTProject"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/versions/{versionId}/projects:
    post:
      summary: Add a PROFILE or SUB DT project binding
      operationId: addVersionProject
      parameters:
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDTProject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/versions/{versionId}/projects/{bindingId}:
    delete:
      summary: Remove a DT project binding
      operationId: removeVersionProject
      parameters:
        - $ref: "#/components/parameters/VersionId"
        - name: bindingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/versions/{versionId}/projects/{role}/graph:
    get:
      summary: BOM-Link SBOM graph for one role-tagged project
      operationId: getProjectGraph
      parameters:
        - $ref: "#/components/parameters/VersionId"
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [ROOT, PROFILE, SUB]
        - $ref: "#/components/parameters/MaxDepth"
        - $ref: "#/components/parameters/MaxNodes"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseGraph"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/DTUnavailable"

  /api/v1/products/{productId}/lineage-graph:
    get:
      summary: Version-lineage graph (RC DB only)
      description: |
        Nodes are versions; edges are parent/fork lineage. Built purely from the
        release catalog database — never calls Dependency-Track and cannot 502.
      operationId: getProductLineage
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - name: axis
          in: query
          schema:
            type: string
            enum: [version, releaseDate]
            default: releaseDate
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineageGraph"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/products/{productId}/timeline:
    get:
      summary: Product-scope release timeline (all branches)
      operationId: getProductTimeline
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/branches/{branchId}/timeline:
    get:
      summary: Branch-scope release timeline
      operationId: getBranchTimeline
      parameters:
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BranchId:
      name: branchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    MaxDepth:
      name: maxDepth
      in: query
      schema:
        type: integer
        default: 10
    MaxNodes:
      name: maxNodes
      in: query
      schema:
        type: integer
        default: 1000

  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProductInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: string

    UpdateProductInput:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string

    BranchLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        type:
          type: string
          enum: [MAIN, RELEASE]
        name:
          type: string
        displayName:
          type: string
        sourceBranchLineId:
          type: string
          format: uuid
        forkedFromVersionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, maintenance, security_only, end_of_support, closed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time

    CreateReleaseLineInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        displayName:
          type: string
        forkedFromVersionId:
          type: string
          format: uuid
          description: A main-branch version to fork the release line from.

    UpdateBranchInput:
      type: object
      properties:
        displayName:
          type: string
        status:
          type: string
          enum: [active, maintenance, security_only, end_of_support, closed]

    Version:
      type: object
      properties:
        id:
          type: string
          format: uuid
        branchLineId:
          type: string
          format: uuid
        versionString:
          type: string
        status:
          type: string
          enum: [incomplete, finalized]
        parentVersionId:
          type: string
          format: uuid
        forkedFromVersionId:
          type: string
          format: uuid
        location:
          type: string
        customer:
          type: string
        releaseDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        projects:
          type: array
          items:
            $ref: "#/components/schemas/VersionDTProject"

    VersionDTProject:
      type: object
      properties:
        id:
          type: integer
        versionId:
          type: string
          format: uuid
        role:
          type: string
          enum: [ROOT, PROFILE, SUB]
        dtProjectUuid:
          type: string
          format: uuid
        bomSerialNumber:
          type: string
        bomVersion:
          type: integer
        bomSha256:
          type: string
        sourceRevision:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateVersionInput:
      type: object
      required: [versionString]
      properties:
        versionString:
          type: string
        forkedFromVersionId:
          type: string
          format: uuid
          description: For a release line's first version, the main version it forks from.

    UpdateVersionInput:
      type: object
      properties:
        versionString:
          type: string
        status:
          type: string
          enum: [incomplete, finalized]
        location:
          type: string
        customer:
          type: string
        releaseDate:
          type: string
          format: date-time
          description: RFC3339 datetime. An empty string clears the release date.

    SetProjectInput:
      type: object
      properties:
        dtProjectUuid:
          type: string
          format: uuid
        bomSerialNumber:
          type: string
        bomVersion:
          type: integer
        bomSha256:
          type: string
        sourceRevision:
          type: string
        label:
          type: string

    AddProjectInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [PROFILE, SUB]
        dtProjectUuid:
          type: string
          format: uuid
        bomSerialNumber:
          type: string
        bomVersion:
          type: integer
        bomSha256:
          type: string
        sourceRevision:
          type: string
        label:
          type: string

    ReleaseGraph:
      type: object
      properties:
        rootNodeId:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
        metadata:
          $ref: "#/components/schemas/GraphMetadata"

    GraphNode:
      type: object
      properties:
        id:
          type: string
        projectUUID:
          type: string
        projectName:
          type: string
        projectVersion:
          type: string
        bomSerialNumber:
          type: string
        bomVersion:
          type: integer
        resolutionStatus:
          type: string
          enum: [resolved, missing_project, missing_bom, missing_bom_ref, invalid]

    GraphEdge:
      type: object
      properties:
        sourceNodeId:
          type: string
        targetNodeId:
          type: string
        bomRef:
          type: string
        resolutionStatus:
          type: string
          enum: [resolved, missing_project, missing_bom, missing_bom_ref, invalid]

    GraphMetadata:
      type: object
      properties:
        totalNodes:
          type: integer
        totalEdges:
          type: integer
        maxDepthReached:
          type: boolean
        maxNodesReached:
          type: boolean
        unresolvedLinks:
          type: integer
        cyclesDetected:
          type: integer

    LineageGraph:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        axis:
          type: string
          enum: [version, releaseDate]
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/LineageNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/LineageEdge"

    LineageNode:
      type: object
      properties:
        versionId:
          type: string
          format: uuid
        branchLineId:
          type: string
          format: uuid
        branchName:
          type: string
        branchType:
          type: string
          enum: [MAIN, RELEASE]
        versionString:
          type: string
        status:
          type: string
          enum: [incomplete, finalized]
        releaseDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    LineageEdge:
      type: object
      properties:
        sourceVersionId:
          type: string
          format: uuid
        targetVersionId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [parent, fork]

    Timeline:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEntry"

    TimelineEntry:
      type: object
      properties:
        versionId:
          type: string
          format: uuid
        branchLineId:
          type: string
          format: uuid
        branchName:
          type: string
        branchType:
          type: string
          enum: [MAIN, RELEASE]
        versionString:
          type: string
        status:
          type: string
          enum: [incomplete, finalized]
        releaseDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    APIError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
        requestId:
          type: string

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    DTUnavailable:
      description: Dependency-Track Unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
