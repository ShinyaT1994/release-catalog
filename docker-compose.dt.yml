# Dependency-Track v5.0 reference setup
# This is NOT started with the Release Catalog.
# Use: docker compose -f docker-compose.dt.yml up -d
services:
  dependency-track-api:
    image: ghcr.io/dependencytrack/apiserver:5.0.4
    ports:
      - "8081:8080"
    environment:
      ALPINE_DATABASE_MODE: external
      ALPINE_DATABASE_URL: jdbc:postgresql://dt-postgres:5432/dtrack
      ALPINE_DATABASE_DRIVER: org.postgresql.Driver
      ALPINE_DATABASE_USERNAME: dtrack
      ALPINE_DATABASE_PASSWORD: dtrack
    depends_on:
      dt-postgres:
        condition: service_healthy
    restart: unless-stopped

  dependency-track-frontend:
    image: ghcr.io/dependencytrack/frontend:5.0.4
    ports:
      - "8082:8080"
    environment:
      API_BASE_URL: http://localhost:8081
    restart: unless-stopped

  dt-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "dtrack"
      POSTGRES_USER: "dtrack"
      POSTGRES_PASSWORD: "dtrack"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - dt-pgdata:/var/lib/postgresql
    restart: unless-stopped

volumes:
  dt-pgdata:
